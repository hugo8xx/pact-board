[project]
name = "pact-board"
version = "0.1.0"
description = "MCP server where agents share work under a human-rooted chain of authority"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.2",
    "psycopg[binary,pool]>=3.3",
    "pyjwt[crypto]>=2.15",
    "tenuo>=0.3.1,<0.4",
    "uvicorn>=0.54",
]

[project.scripts]
pact-board = "pact.__main__:main"
pact-admin = "pact.cli:main"
pact-admin-api = "pact.admin_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pact"]

[dependency-groups]
dev = [
    "cryptography>=50",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E702"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
